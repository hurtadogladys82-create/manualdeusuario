<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t2 d2">
  <title id="t2">Cómo limpiar la pantalla</title>
  <desc id="d2">A la izquierda, el modo correcto: humedecer el paño de microfibra y pasarlo en una dirección. A la derecha, lo que no se debe hacer: rociar líquido directamente sobre la pantalla.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,Arial,sans-serif;fill:#242424}
    .line{fill:#fff;stroke:#172b4d;stroke-width:3;stroke-linejoin:round}
    .cap{font-size:21px;text-anchor:middle}
    .tag{font-size:20px;font-weight:700;fill:#fff;text-anchor:middle}
  </style>
  <rect width="600" height="400" fill="#f5f9fc"/>
  <rect x="16" y="16" width="276" height="368" rx="6" fill="#fff" stroke="#d9e2ea"/>
  <rect x="308" y="16" width="276" height="368" rx="6" fill="#fff" stroke="#d9e2ea"/>
  <!-- etiquetas -->
  <rect x="104" y="34" width="100" height="32" rx="16" fill="#107c41"/><text class="tag" x="154" y="56">✓ Así</text>
  <rect x="396" y="34" width="100" height="32" rx="16" fill="#b4233c"/><text class="tag" x="446" y="56">✗ No</text>
  <!-- izquierda: pantalla -->
  <rect class="line" x="52" y="96" width="204" height="130" rx="8"/>
  <rect x="64" y="108" width="180" height="106" rx="3" fill="#e3effa" stroke="#b9d4ec" stroke-width="1.5"/>
  <line x1="154" y1="226" x2="154" y2="250" stroke="#172b4d" stroke-width="3"/>
  <line x1="124" y1="252" x2="184" y2="252" stroke="#172b4d" stroke-width="4" stroke-linecap="round"/>
  <!-- paño -->
  <rect x="110" y="128" width="88" height="64" rx="10" fill="#fff" stroke="#0067b8" stroke-width="3"/>
  <path d="M154 140 C 146 152, 146 160, 154 164 C 162 160, 162 152, 154 140 Z" fill="#8fc2ea" stroke="#0067b8" stroke-width="2"/>
  <!-- flechas arriba/abajo -->
  <path d="M222 120 L 222 200 M 222 120 L 216 130 M 222 120 L 228 130 M 222 200 L 216 190 M 222 200 L 228 190" fill="none" stroke="#0067b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cap" x="154" y="296">Humedece el paño</text>
  <text class="cap" x="154" y="324">y pasa en una dirección</text>
  <text class="cap" x="154" y="352" style="fill:#5b6470;font-size:18px">sin presionar</text>
  <!-- derecha: pantalla -->
  <rect class="line" x="324" y="96" width="156" height="130" rx="8"/>
  <rect x="336" y="108" width="132" height="106" rx="3" fill="#e3effa" stroke="#b9d4ec" stroke-width="1.5"/>
  <line x1="402" y1="226" x2="402" y2="250" stroke="#172b4d" stroke-width="3"/>
  <line x1="372" y1="252" x2="432" y2="252" stroke="#172b4d" stroke-width="4" stroke-linecap="round"/>
  <!-- atomizador -->
  <rect x="520" y="140" width="38" height="70" rx="6" class="line"/>
  <rect x="508" y="120" width="30" height="22" rx="4" fill="#172b4d"/>
  <path d="M508 128 L 494 128" stroke="#172b4d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="480" cy="124" r="3" fill="#0067b8"/><circle cx="470" cy="134" r="3" fill="#0067b8"/><circle cx="482" cy="140" r="3" fill="#0067b8"/><circle cx="468" cy="148" r="3" fill="#0067b8"/><circle cx="458" cy="130" r="3" fill="#0067b8"/><circle cx="460" cy="158" r="3" fill="#0067b8"/>
  <!-- tachado -->
  <path d="M336 108 L 468 214 M 468 108 L 336 214" stroke="#b4233c" stroke-width="6" stroke-linecap="round" opacity=".85"/>
  <text class="cap" x="446" y="296">No rocíes líquido</text>
  <text class="cap" x="446" y="324">directo en la pantalla</text>
  <text class="cap" x="446" y="352" style="fill:#5b6470;font-size:18px">ni uses papel de cocina</text>
</svg>
