<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t3 d3">
  <title id="t3">Ventilación de una PC de escritorio</title>
  <desc id="d3">Esquema de un gabinete con el aire fresco entrando por el frente y el aire caliente saliendo por atrás y por arriba, con unos diez centímetros de espacio libre a cada lado.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,Arial,sans-serif;fill:#242424}
    .line{fill:#fff;stroke:#172b4d;stroke-width:3;stroke-linejoin:round}
    .in{stroke:#0067b8;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .out{stroke:#986f0b;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .lab{font-size:21px}
  </style>
  <rect width="600" height="400" fill="#f5f9fc"/>
  <!-- paredes -->
  <rect x="40" y="52" width="14" height="260" fill="#cdd5dc"/>
  <rect x="546" y="52" width="14" height="260" fill="#cdd5dc"/>
  <line x1="30" y1="312" x2="570" y2="312" stroke="#8a969f" stroke-width="3"/>
  <!-- gabinete -->
  <rect class="line" x="218" y="78" width="164" height="234" rx="9"/>
  <line x1="230" y1="96" x2="230" y2="190" stroke="#8a969f" stroke-width="3" stroke-dasharray="6 6"/>
  <line x1="370" y1="96" x2="370" y2="150" stroke="#8a969f" stroke-width="3" stroke-dasharray="6 6"/>
  <rect x="246" y="102" width="108" height="46" rx="5" fill="#eff6fc" stroke="#b9d4ec" stroke-width="2"/>
  <circle cx="300" cy="125" r="14" fill="none" stroke="#8a969f" stroke-width="2"/>
  <rect x="246" y="168" width="108" height="100" rx="5" fill="#eff6fc" stroke="#b9d4ec" stroke-width="2"/>
  <!-- entrada (frente, izquierda) -->
  <path class="in" d="M110 250 L 214 250 M 200 238 L 214 250 L 200 262"/>
  <path class="in" d="M110 200 L 214 200 M 200 188 L 214 200 L 200 212"/>
  <!-- salida (atrás, derecha) -->
  <path class="out" d="M386 130 L 490 130 M 476 118 L 490 130 L 476 142"/>
  <path class="out" d="M300 74 L 300 40 M 288 54 L 300 40 L 312 54"/>
  <!-- cotas -->
  <path d="M56 336 L 216 336 M 56 336 L 66 330 M 56 336 L 66 342 M 216 336 L 206 330 M 216 336 L 206 342" stroke="#172b4d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M384 336 L 544 336 M 384 336 L 394 330 M 384 336 L 394 342 M 544 336 L 534 330 M 544 336 L 534 342" stroke="#172b4d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text class="lab" x="136" y="366" text-anchor="middle">≈ 10 cm libres</text>
  <text class="lab" x="464" y="366" text-anchor="middle">≈ 10 cm libres</text>
  <text class="lab" x="64" y="236" style="fill:#0067b8;font-weight:600">Entra aire</text>
  <text class="lab" x="396" y="176" style="fill:#986f0b;font-weight:600">Sale aire</text>
  <text class="lab" x="396" y="201" style="fill:#986f0b;font-weight:600">caliente</text>
</svg>
