<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="t1 d1">
  <title id="t1">Puntos de revisión de una laptop</title>
  <desc id="d1">Esquema de una laptop con cinco puntos numerados: pantalla, teclado, rejillas de ventilación, puertos y cargador.</desc>
  <style>
    text{font-family:"Segoe UI",system-ui,Arial,sans-serif;fill:#242424}
    .line{fill:#fff;stroke:#172b4d;stroke-width:3;stroke-linejoin:round}
    .soft{fill:none;stroke:#8a969f;stroke-width:2;stroke-linecap:round}
    .lead{stroke:#0067b8;stroke-width:2;fill:none}
    .dot{fill:#0067b8}
    .num{fill:#fff;font-weight:700;font-size:18px;text-anchor:middle}
    .lab{font-size:22px}
  </style>
  <rect width="600" height="400" fill="#f5f9fc"/>
  <!-- pantalla -->
  <rect class="line" x="66" y="40" width="270" height="170" rx="9"/>
  <rect x="80" y="54" width="242" height="142" rx="3" fill="#e3effa" stroke="#b9d4ec" stroke-width="1.5"/>
  <!-- base -->
  <polygon class="line" points="46,216 356,216 396,284 8,284"/>
  <!-- teclas -->
  <line class="soft" x1="68" y1="231" x2="334" y2="231" stroke-dasharray="14 7"/>
  <line class="soft" x1="60" y1="244" x2="342" y2="244" stroke-dasharray="14 7"/>
  <line class="soft" x1="52" y1="257" x2="350" y2="257" stroke-dasharray="14 7"/>
  <rect x="166" y="265" width="62" height="10" rx="3" fill="#fff" stroke="#8a969f" stroke-width="2"/>
  <!-- rejillas: ranuras en el borde derecho -->
  <line x1="346" y1="222" x2="353" y2="234" stroke="#172b4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="352" y1="232" x2="359" y2="244" stroke="#172b4d" stroke-width="3" stroke-linecap="round"/>
  <line x1="358" y1="242" x2="365" y2="254" stroke="#172b4d" stroke-width="3" stroke-linecap="round"/>
  <!-- puertos -->
  <rect x="370" y="266" width="13" height="7" rx="2" fill="#0067b8"/>
  <rect x="375" y="276" width="13" height="7" rx="2" fill="#0067b8" opacity="0"/>
  <!-- cargador -->
  <path d="M378 274 C 392 304, 372 322, 348 332" fill="none" stroke="#172b4d" stroke-width="3" stroke-linecap="round"/>
  <rect class="line" x="286" y="324" width="64" height="30" rx="5"/>
  <line x1="286" y1="339" x2="252" y2="339" stroke="#172b4d" stroke-width="3" stroke-linecap="round"/>
  <!-- guías -->
  <line class="lead" x1="300" y1="100" x2="437" y2="100"/>
  <line class="lead" x1="300" y1="238" x2="437" y2="160"/>
  <line class="lead" x1="360" y1="236" x2="437" y2="220"/>
  <line class="lead" x1="378" y1="270" x2="437" y2="280"/>
  <line class="lead" x1="318" y1="339" x2="437" y2="340"/>
  <circle class="dot" cx="300" cy="100" r="5"/>
  <circle class="dot" cx="300" cy="238" r="5"/>
  <circle class="dot" cx="360" cy="236" r="5"/>
  <circle class="dot" cx="378" cy="270" r="5"/>
  <circle class="dot" cx="318" cy="339" r="5"/>
  <!-- leyenda -->
  <circle class="dot" cx="452" cy="100" r="15"/><text class="num" x="452" y="106">1</text><text class="lab" x="476" y="108">Pantalla</text>
  <circle class="dot" cx="452" cy="160" r="15"/><text class="num" x="452" y="166">2</text><text class="lab" x="476" y="168">Teclado</text>
  <circle class="dot" cx="452" cy="220" r="15"/><text class="num" x="452" y="226">3</text><text class="lab" x="476" y="228">Rejillas</text>
  <circle class="dot" cx="452" cy="280" r="15"/><text class="num" x="452" y="286">4</text><text class="lab" x="476" y="288">Puertos</text>
  <circle class="dot" cx="452" cy="340" r="15"/><text class="num" x="452" y="346">5</text><text class="lab" x="476" y="348">Cargador</text>
  <text x="300" y="384" text-anchor="middle" style="fill:#5b6470;font-size:18px">Revisa cada punto con el equipo apagado</text>
</svg>
